CONFIG_DOOR_LOCK_GESTURE_ACCESS=y

# Camera configuration
CONFIG_VIDEO=y
CONFIG_SPI=y

CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=40960
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
CONFIG_VIDEO_LOG_LEVEL_INF=y
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=3


# Frame forwarding over serial.
CONFIG_DOOR_LOCK_GESTURE_ACCESS_FRAME_FORWARDING=n
