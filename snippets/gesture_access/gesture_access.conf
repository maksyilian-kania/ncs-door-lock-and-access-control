# Master switch for the SPI camera + on-device gesture inference feature.
# Off by default for every application; this snippet is the only thing that
# turns it on (west build -S gesture_access).
CONFIG_DOOR_LOCK_GESTURE_ACCESS=y

# Already implied transitively via DOOR_LOCK_CAMERA_SPI's `select SPI` /
# `select VIDEO`, but set explicitly here so the feature's dependencies are
# visible without having to trace the Kconfig select chain.
CONFIG_SPI=y
CONFIG_VIDEO=y

# zephyr/drivers/video/Kconfig defaults CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE to
# 2 MiB (sized for real cameras/larger frame formats) - wildly oversized for
# our 96x96 grayscale frames (9216 bytes each) and enough on its own to blow
# every RAM budget on this SoC family. Size for CONFIG_VIDEO_BUFFER_POOL_NUM_MAX
# (default 2) frames plus headroom for the heap allocator's own overhead.
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=24576

# Required for the camera's PM_DEVICE_DT_INST_DEFINE hook
# (spi_cam_pm_action() in spi_cam.c) and &spi22's
# zephyr,pm-device-runtime-auto to actually take effect. Without these the
# driver's PM code compiles in but is a no-op. See camera driver plan
# section 4.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Capture cadence and dedicated-workqueue priority/stack already have
# driver-side defaults (DOOR_LOCK_CAMERA_SPI_CAPTURE_INTERVAL_MS_DEFAULT=500,
# DOOR_LOCK_GESTURE_ACCESS_WORKQUEUE_PRIORITY=11,
# DOOR_LOCK_GESTURE_ACCESS_WORKQUEUE_STACK_SIZE=16384). The stack includes
# headroom for Edge Impulse's one-time Nordic Axon model setup. Uncomment and
# override only if a given application build has measured stack usage for a
# different model.
# CONFIG_DOOR_LOCK_CAMERA_SPI_CAPTURE_INTERVAL_MS_DEFAULT=500
# CONFIG_DOOR_LOCK_GESTURE_ACCESS_WORKQUEUE_PRIORITY=11
# CONFIG_DOOR_LOCK_GESTURE_ACCESS_WORKQUEUE_STACK_SIZE=16384

# sdk-edge-ai is group-filtered out of west.yml's projects by default
# (see the "sdk-edge-ai" entry in manifest.group-filter), since most builds
# of this repo don't need the Edge Impulse SDK/Axon NPU driver it vendors.
# subsys/gesture_access/model/Kconfig's DOOR_LOCK_GESTURE_ACCESS_MODEL
# already selects NRF_AXON unconditionally (the deployed model targets the
# Axon backend - see that Kconfig's help text), so building with this
# snippet requires that group enabled locally, e.g.:
#   west config manifest.group-filter +sdk-edge-ai
#   west update
# (this only needs doing once per workspace, not per build).

# KNOWN UNRESOLVED BUILD BLOCKER when combining this snippet with the
# aliro-access-control-app application: DOOR_LOCK_GESTURE_ACCESS_MODEL
# selects FPU (the Edge Impulse SDK's DSP/feature-extraction step runs in
# float), and edge-ai's lib/axon/CMakeLists.txt links a *hard*-float-ABI
# build of the Axon driver (libnrf-axon-driver-internal-fpu.a) whenever
# CONFIG_FPU=y. That conflicts at link time with this app's prebuilt
# lib/aliro/bin/.../libaliro.a, which is a *soft*-float-ABI build ("uses
# VFP register arguments, ... does not" from ld, in whichever direction
# doesn't match CONFIG_FP_HARDABI/CONFIG_FP_SOFTABI). Neither library has
# an alternate-ABI variant checked in, so this can't be fixed from Kconfig
# alone - it needs a hard-float libaliro.a (or a non-FPU Axon driver path)
# from whoever owns those prebuilt binaries.

# Forward captured grayscale frames over USB CDC ACM while validating the
# camera/model pipeline. View them with scripts/gesture_frame_viewer.py.
CONFIG_DOOR_LOCK_GESTURE_ACCESS_FRAME_FORWARDING=y
