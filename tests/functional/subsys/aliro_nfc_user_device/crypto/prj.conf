# Aliro::Interface::UserDevice::Crypto/CredentialSigning implementation
# under test needs the "aliro/..." headers and CryptoTypes definitions
# (APP_PLAN.md AWP5); the real Aliro::UserDeviceStack protocol code itself
# is not linked or exercised here.
CONFIG_NCS_ALIRO_USER_DEVICE=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_ZTEST=y
# test_credential_signing.cpp puts a PersistedCredential (two embedded
# 1024-byte OptionalDocument buffers plus a 16-entry Binding array) on the
# test-thread stack; 8192 overflowed on-target (see docs/evidence.md AWP5).
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_LOG=y

CONFIG_PSA_CRYPTO=y
