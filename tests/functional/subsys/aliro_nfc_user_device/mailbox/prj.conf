# Aliro::Interface::UserDevice::Mailbox implementation under test needs the
# "aliro/..." headers and CryptoTypes definitions (APP_PLAN.md AWP6); the
# real Aliro::UserDeviceStack protocol code itself is not linked or
# exercised here (nothing in the checked-out ncs-aliro baseline calls the
# Mailbox contract yet; see docs/evidence.md).
CONFIG_NCS_ALIRO_USER_DEVICE=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_LOG=y

CONFIG_PSA_CRYPTO=y
