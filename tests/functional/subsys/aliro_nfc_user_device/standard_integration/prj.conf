CONFIG_NCS_ALIRO_USER_DEVICE=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_ZTEST=y
# The test thread provisions PersistedCredential-sized payloads and runs the
# test Reader's PSA ECDH/ECDSA/HKDF/AES-GCM operations.
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192

# Immediate mode, as in the application's prj.conf: log_capture.c records
# the Transaction::NotifyResult() adapter's output synchronously.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# k_poll() multiplexes the worker thread's wait between the coalesced
# field-lifecycle semaphore and the bounded command/stack-event queue.
CONFIG_POLL=y

# PSA Crypto (volatile only). The application adapters select their own
# algorithms (platform/crypto/Kconfig); the fake key backends and the test
# Reader additionally import ECC key pairs.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
