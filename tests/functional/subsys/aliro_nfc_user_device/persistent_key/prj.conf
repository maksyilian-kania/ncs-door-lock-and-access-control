# Only the "aliro/..." headers are needed; no Aliro::UserDeviceStack
# protocol code is exercised.
CONFIG_NCS_ALIRO_USER_DEVICE=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_LOG=y

# Satisfies the PSA_WANT_* selections of the application Kconfig files. The
# Kpersistent key backend is a fake; only the shared credential key-backend
# fake calls PSA, to provision credentials for the cascade tests.
CONFIG_PSA_CRYPTO=y
