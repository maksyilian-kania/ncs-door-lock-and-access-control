CONFIG_NCS_ALIRO_USER_DEVICE=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_LOG=y

# k_poll() multiplexes the worker thread's wait between the coalesced
# field-lifecycle semaphore and the bounded command/stack-event queue.
CONFIG_POLL=y

# Small, deterministic queue depth so the overflow test case only needs a
# handful of un-drained posts.
CONFIG_ALIRO_UD_NFC_EVENT_QUEUE_DEPTH=4

# Short watchdog timeout so the timeout-termination test doesn't need to
# wait the 2000 ms production default. Kept comfortably above the largest
# intentional idle gap between events in any other test case (~100 ms, two
# SettleWorker() calls with no watchdog feed in between) so the shortened
# timeout does not spuriously fire in unrelated tests.
CONFIG_NCS_ALIRO_USER_DEVICE_SESSION_TIMEOUT_NFC=500
