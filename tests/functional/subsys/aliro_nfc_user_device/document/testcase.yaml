common:
  build_only: false
  platform_allow: native_sim/native/64
  integration_platforms:
    - native_sim/native/64
  tags: aliro_nfc_user_device
tests:
  aliro_nfc_user_device.functional.document:
    {}
  # Smallest configurable capacities: one credential, one-byte documents,
  # and exactly the two snapshots one AUTH1 opens.
  aliro_nfc_user_device.functional.document.min_capacity:
    extra_configs:
      - CONFIG_ALIRO_UD_MAX_CREDENTIALS=1
      - CONFIG_ALIRO_UD_DOCUMENT_MAX_SIZE=1
      - CONFIG_ALIRO_UD_MAX_OPEN_DOCUMENT_SNAPSHOTS=2
  # Largest configurable capacities, with documents at the stack's default
  # snapshot bound.
  aliro_nfc_user_device.functional.document.max_capacity:
    extra_configs:
      - CONFIG_ALIRO_UD_MAX_CREDENTIALS=8
      - CONFIG_ALIRO_UD_DOCUMENT_MAX_SIZE=4096
      - CONFIG_ALIRO_UD_MAX_OPEN_DOCUMENT_SNAPSHOTS=8
