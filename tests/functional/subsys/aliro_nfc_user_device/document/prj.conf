# Only the "aliro/..." headers and the public Document snapshot bound are
# needed; no Aliro::UserDeviceStack protocol code is exercised.
CONFIG_NCS_ALIRO_USER_DEVICE=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_ZTEST=y
# The maximum-capacity configuration holds 4096 B documents inside the
# credential records the store copies on the stack.
CONFIG_ZTEST_STACK_SIZE=65536
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_LOG=y

CONFIG_PSA_CRYPTO=y
