CONFIG_NCS_ALIRO_USER_DEVICE=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_ZTEST=y
# Test helpers hold credential records on the ztest thread's stack.
CONFIG_ZTEST_STACK_SIZE=16384

CONFIG_LOG=y

CONFIG_POLL=y

# The "aliro-ud" shell command tree under test, through the dummy backend.
# The command buffer matches the application's (fits a maximum-size
# document line); the output buffer fits one 128-byte "document read".
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_CMD_BUFF_SIZE=2200
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=600
# Fault-injection logs go to the console, not into the checked CLI output.
CONFIG_SHELL_LOG_BACKEND=n
# Same as the application's: the staging transaction builds credential
# records on the shell thread's stack.
CONFIG_SHELL_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096

# Volatile PSA crypto backs the fake key backend's real scalar validation.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
