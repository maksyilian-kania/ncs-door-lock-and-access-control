#
# Aliro User Device stack (Aliro::UserDeviceStack facade, checked out under
# the "ncs-aliro" west project). Kconfig/CMake integration is supplied by the
# module itself; no manual link wiring is added here.
#
CONFIG_NCS_ALIRO_USER_DEVICE=y

#
# NFC-A Type 4 Tag/ISO-DEP listen-mode transport (AWP1). Raw ISO-DEP mode
# only: no NDEF payload is registered.
#
CONFIG_NFC_T4T_NRFXLIB=y

# Basic system configuration
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

#
# k_poll() multiplexes the NFC/stack worker thread's wait between the
# coalesced field-lifecycle semaphore and the bounded command/stack-event
# queue (AWP1 lifecycle-race fix; see nfc_worker.cpp).
#
CONFIG_POLL=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

#
# Development CLI over the DK virtual UART (AWP2): Zephyr shell on the same
# UART as the console, at the board's default 115200-8N1. See
# `src/cli/cli.cpp` for the "aliro-ud" root command.
#
CONFIG_SHELL=y
#
# "aliro-ud credential set-access-document"/"set-revocation-document" take
# a hex-encoded document up to CONFIG_ALIRO_UD_DOCUMENT_MAX_SIZE (default
# 1024) bytes wide (APP_PLAN.md AWP3); the shell command buffer must fit
# the longest such line: command prefix (~40 chars) + 2 hex chars/byte.
CONFIG_SHELL_CMD_BUFF_SIZE=2200
