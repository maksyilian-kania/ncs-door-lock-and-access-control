  application_slices: [C1.2, C1.3, C7.2]
  application_status: verified-host
  verification:
    host:
      - exchange_lifecycle.test_unauthorized_write_fails_and_destroys_session_keys
      - exchange_lifecycle.test_unauthenticated_exchange_runs_failure_process
      - exchange_lifecycle.test_rejected_auth_commands_end_transaction
      - standard_integration.test_untrusted_certificate_is_rejected_without_disclosing_trust
    target: []
  target_assignment: C7.2 NFC_UD_NEG tests.
  stack_gate: none
  evidence:
    - evidence/C1.2.md
    - evidence/C1.3.md
  notes: The failure process is stack-owned; key destruction is observed as rejection of later EXCHANGE.

- requirement: ALIRO-UD-SYRS-P1-039
  summary: Reject malformed, unsupported-version, wrong-P1/P2, out-of-sequence, or incomplete-chained AUTH0/AUTH1.
  application_slices: [C1.3, C7.2]
  application_status: planned
  verification:
    host:
      - exchange_lifecycle.test_rejected_auth_commands_end_transaction
    target: []
  target_assignment: C7.2 NFC_UD_NEG_AUTH0_WRONG_VALUE, NFC_UD_NEG_AUTH1_WRONG_VALUE, NFC_UD_NEG_AUTH0_CHAINING_NOT_COMPLETED, NFC_UD_NEG_AUTH1_CHAINING_NOT_COMPLTED.
  stack_gate: none
  evidence:
    - evidence/C1.3.md
  notes: Host covers wrong P1/P2, unsupported version, and out-of-sequence. Wrong-value and incomplete-chaining variants are stack-owned validation and are deferred to C7.2. No stack defect is known.

