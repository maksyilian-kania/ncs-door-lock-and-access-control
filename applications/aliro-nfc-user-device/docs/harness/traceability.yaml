# Aliro NFC User Device requirement traceability.
#
# Validated by `scripts/validate-traceability.py --required`. Each selected
# requirement appears exactly once. Paths in `evidence` are relative to this
# directory or to the repository root.
#
# application_status:
#   planned          a host-verifiable clause is still open, or only target
#                    acceptance can verify the requirement.
#   blocked-stack    a precise ncs-aliro defect or missing behavior blocks the
#                    application path (`stack_gate` names revision and finding).
#   verified-host    every host-verifiable clause has current host evidence;
#                    target acceptance remains assigned to C7.
#   verified-target  verified-host plus physical target evidence.
#
# No status claims complete-system, stack, or conformance compliance. Stack
# ownership is recorded in `stack_gate` and `notes`, separately from the
# application status.

